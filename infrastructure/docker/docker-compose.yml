networks:
  project-ops-network:
    driver: bridge
  web:
    external: true
  unicorn-network:
    external: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

services:
  # PostgreSQL 17 - Primary Database
  project-ops-postgres:
    image: postgres:17-alpine
    container_name: project-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_ops}
      POSTGRES_USER: ${POSTGRES_USER:-project_ops_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
      - ../database/backups:/backups
    ports:
      - "5435:5432"
    networks:
      - project-ops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-project_ops_admin} -d ${POSTGRES_DB:-project_ops}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=2621kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c log_statement=mod
      -c log_duration=on
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    labels:
      - "com.projectops.service=database"
      - "com.projectops.environment=${ENVIRONMENT:-production}"

  # Redis 7 - Cache & Session Store
  project-ops-redis:
    image: redis:7-alpine
    container_name: project-ops-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    ports:
      - "6382:6379"
    networks:
      - project-ops-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.projectops.service=cache"

  # Object storage: shared `unicorn-garage` (Garage S3) on the host. The
  # backend reads `MINIO_*` env vars below for historical reasons but the
  # endpoint actually points at unicorn-garage. There is intentionally no
  # local MinIO container — see CHANGELOG v1.3.0 for the swap rationale.

  # NestJS Backend API
  project-ops-backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}
    container_name: project-ops-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3201
      # Runtime DB role. PO_DB_USER/PO_DB_PASSWORD let the live cutover flip the
      # backend to the NOBYPASSRLS project_ops_app role without touching the
      # owner creds (defaults preserve the legacy owner connection).
      DATABASE_URL: postgresql://${PO_DB_USER:-project_ops_admin}:${PO_DB_PASSWORD:-${POSTGRES_PASSWORD}}@project-ops-postgres:5432/${POSTGRES_DB:-project_ops}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@project-ops-redis:6379
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://auth.unicorncommander.ai}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-uchub}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-project-ops}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_CALLBACK_URL: https://${API_DOMAIN}/api/v1/auth/keycloak/callback
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-unicorn-garage}
      MINIO_PORT: ${MINIO_PORT:-3900}
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_APP_USER:-projectops}
      MINIO_SECRET_KEY: ${MINIO_APP_PASSWORD}
      MINIO_PUBLIC_ENDPOINT: ${STORAGE_DOMAIN}
      MINIO_PUBLIC_PORT: 443
      MINIO_PUBLIC_USE_SSL: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      # Fail-closed secret for SMTP password encryption (required in production;
      # generate with: openssl rand -hex 32). The backend refuses to boot without it.
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY}
      # Keycloak token audience enforcement. Defaults ON; the allow-list defaults
      # to KEYCLOAK_CLIENT_ID. Set KEYCLOAK_ENFORCE_AUDIENCE=false (or extend
      # KEYCLOAK_EXPECTED_AUDIENCES, CSV) to tune without a rebuild.
      KEYCLOAK_ENFORCE_AUDIENCE: ${KEYCLOAK_ENFORCE_AUDIENCE:-true}
      KEYCLOAK_EXPECTED_AUDIENCES: ${KEYCLOAK_EXPECTED_AUDIENCES:-}
      # Phase-E uc-registry workspace SoR. No-op when unset; set the URL to enable
      # registering every new workspace with the registry before the prod RLS flip.
      UC_REGISTRY_URL: ${UC_REGISTRY_URL:-}
      CORS_ORIGIN: https://${DOMAIN}
      FRONTEND_URL: https://${DOMAIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      BRIGADE_URL: ${BRIGADE_URL:-https://brigade.magicunicorn.dev}
      BRIGADE_API_KEY: ${BRIGADE_API_KEY}
      BRIGADE_AGENT_ID: ${BRIGADE_AGENT_ID:-project-ops-assistant}
      # Brigade federation broker issuers PO trusts (comma-separated).
      # Defaults to the customer-facing prod broker. Set "" to disable
      # the federation auth branch. Add dogfood here for internal testing:
      # BRIGADE_TRUSTED_ISSUERS=https://brigade.unicorncommander.ai,https://brigade.magicunicorn.dev
      BRIGADE_TRUSTED_ISSUERS: ${BRIGADE_TRUSTED_ISSUERS:-https://brigade.unicorncommander.ai}
      # SSO access allowlist (v1.6.24) — controls who can JIT-provision a
      # Project-Ops account from the shared uchub Keycloak realm + at what
      # role. Without this var the backend falls back to admitting only
      # Aaron + Shafen as ADMIN and rejects everyone else.
      PROJECT_OPS_ACCESS_LIST: ${PROJECT_OPS_ACCESS_LIST:-}
      # Ops-Center entitlement gate — the launch-gate replacement for the
      # allowlist above. OFF unless ENABLED is truthy AND UC_ENTITLEMENTS_URL is
      # set (else inert -> allowlist). On an indeterminate result (endpoint
      # outage) FAIL_OPEN=true degrades to the allowlist; false denies (closed).
      PROJECT_OPS_ENTITLEMENTS_ENABLED: ${PROJECT_OPS_ENTITLEMENTS_ENABLED:-false}
      UC_ENTITLEMENTS_URL: ${UC_ENTITLEMENTS_URL:-}
      PROJECT_OPS_FEATURE_KEY: ${PROJECT_OPS_FEATURE_KEY:-project_ops_access}
      PROJECT_OPS_ENTITLEMENTS_FAIL_OPEN: ${PROJECT_OPS_ENTITLEMENTS_FAIL_OPEN:-false}
      # Soft-enforce: on a DEFINITIVE deny, grandfather allowlisted users in (the
      # seed-then-enforce migration aid). Gate still hard-denies non-allowlisted.
      PROJECT_OPS_ENTITLEMENTS_ALLOWLIST_FALLBACK: ${PROJECT_OPS_ENTITLEMENTS_ALLOWLIST_FALLBACK:-false}
      UC_ENTITLEMENTS_TIMEOUT_MS: ${UC_ENTITLEMENTS_TIMEOUT_MS:-5000}
      # Trusted sibling-app federation actors for the propose-only triage
      # ingest (v1.8.0). Empty = zero federation trust.
      PROJECT_OPS_FEDERATION_ACTORS: ${PROJECT_OPS_FEDERATION_ACTORS:-}
      # --- Suite tenancy (PROJ-2026-000023, Phase 1: additive/inert) ---
      # DEFAULT_WORKSPACE_ID: the single bootstrap/dogfood workspace id new
      # rows resolve to until per-membership resolution drives it. Defaults to
      # the suite-canonical Magic Unicorn id (shared with Meeting-Ops +
      # Contact-Ops; the mu_canonical_rekey migration re-keys the old
      # self-minted bootstrap id to it). uc-registry owns real ids; PO never
      # mints.
      DEFAULT_WORKSPACE_ID: ${DEFAULT_WORKSPACE_ID:-019e50a3-d995-723f-ab66-0f765f92c0f4}
      # PROJECT_OPS_TENANCY_ENABLED: master switch for the membership gate.
      # DEFAULT OFF == today's behavior (no membership required, RLS inert
      # because the runtime still connects as the table owner). Do NOT enable
      # this until the runtime DATABASE_URL is flipped to the NOBYPASSRLS
      # project_ops_app role (a later rollout phase).
      PROJECT_OPS_TENANCY_ENABLED: ${PROJECT_OPS_TENANCY_ENABLED:-false}
      # TIME_TRACKING_ENABLED: feature gate for the time-tracking module
      # (404-guards the REST routes + hides the MCP time tools when false).
      TIME_TRACKING_ENABLED: ${TIME_TRACKING_ENABLED:-true}
      # BRIGADE_EXPECTED_AUDIENCE: the `aud` a Brigade federation token must
      # carry to be accepted by PO. Tokens minted for other apps are rejected
      # (audience-binding fence, SUITE-IDENTITY §9.4).
      BRIGADE_EXPECTED_AUDIENCE: ${BRIGADE_EXPECTED_AUDIENCE:-project-ops}
      # Sentry / Glitchtip — opt-in. SDK is a no-op when DSN is empty.
      # Production points at the self-hosted Glitchtip on bigboy. Reports
      # 5xx errors + uncaught exceptions only (4xx is the user's problem
      # and would just be noise). See docs/AI_ASSISTANT_DEMO.md for the
      # silent-failure bug class this catches.
      SENTRY_DSN: ${SENTRY_DSN_BACKEND:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    ports:
      - "3201:3201"
    networks:
      - project-ops-network
      - web
      - unicorn-network
    depends_on:
      project-ops-postgres:
        condition: service_healthy
      project-ops-redis:
        condition: service_healthy
      # Object storage dependency intentionally absent — the backend uses
      # the shared `unicorn-garage` (Garage S3) container which lives in
      # its own compose stack. The MINIO_* env vars below are pointed at
      # that hostname; storage-config cleanup is tracked separately.
    volumes:
      - ../../backend/logs:/app/logs
      - ../../backend/uploads:/app/uploads
    healthcheck:
      # Use the unconditional liveness probe; /api/v1/health runs terminus
      # memory checks (heap > 150MB, RSS > 300MB) that flap under normal
      # load and cause Traefik to drop the backend.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3201/api/v1/health/live', (r) => {process.exit(r.statusCode === 200 ? 0 : 1);})"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.projectops-backend.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.projectops-backend.entrypoints=websecure"
      - "traefik.http.routers.projectops-backend.tls=true"
      - "traefik.http.routers.projectops-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.projectops-backend.loadbalancer.server.port=3201"
      - "traefik.http.middlewares.projectops-cors.headers.accesscontrolallowmethods=GET,OPTIONS,PUT,POST,DELETE,PATCH"
      - "traefik.http.middlewares.projectops-cors.headers.accesscontrolalloworiginlist=https://${DOMAIN}"
      - "traefik.http.middlewares.projectops-cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.projectops-cors.headers.addvaryheader=true"

  # Next.js Frontend
  project-ops-frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}/api/v1
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-https://auth.unicorncommander.ai}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-uchub}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-project-ops}
        # Sentry / Glitchtip — must be a build arg so Next.js inlines the
        # DSN into the client bundle. Empty-string fallback keeps the
        # build clean when error tracking is opt-out per environment.
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
        NEXT_PUBLIC_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NODE_ENV:-production}
        # Source-map upload — build-time only, not baked into runtime.
        # Without SENTRY_AUTH_TOKEN the upload step is a no-op.
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_URL: ${SENTRY_URL:-https://glitchtip.magicunicorn.dev}
    container_name: project-ops-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3200
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}/api/v1
      NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-https://auth.unicorncommander.ai}
      NEXT_PUBLIC_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-uchub}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-project-ops}
      NEXT_TELEMETRY_DISABLED: 1
      # Server-side Sentry (Next.js Route Handlers + middleware fall here)
      SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_ENVIRONMENT: ${NODE_ENV:-production}
    ports:
      - "3200:3200"
    networks:
      - project-ops-network
      - web
    depends_on:
      - project-ops-backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3200', (r) => {process.exit(r.statusCode === 200 ? 0 : 1);})"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.projectops-frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.projectops-frontend.entrypoints=websecure"
      - "traefik.http.routers.projectops-frontend.tls=true"
      - "traefik.http.routers.projectops-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.projectops-frontend.loadbalancer.server.port=3200"
